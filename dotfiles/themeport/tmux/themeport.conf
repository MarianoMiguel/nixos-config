# themeport tmux colors (sourced from tmux.conf)
set -g status-style "bg=#10101a,fg=#e0def4"
set -g status-left-style "bg=#ebbcba,fg=#14131e"
set -g window-status-current-style "bg=#403d52,fg=#e0def4,bold"
set -g window-status-style "bg=default,fg=#908caa"
set -g pane-border-style "fg=#403d52"
set -g pane-active-border-style "fg=#ebbcba"
set -g message-style "bg=#403d52,fg=#e0def4"
set -g mode-style "bg=#403d52,fg=#e0def4"
set -g copy-mode-match-style "bg=#f6c177,fg=#14131e"
set -g copy-mode-current-match-style "bg=#eb6f92,fg=#14131e"
