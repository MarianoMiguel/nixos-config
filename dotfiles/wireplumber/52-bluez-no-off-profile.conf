monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        # WirePlumber remembers the last card profile per device in
        # ~/.local/state/wireplumber/default-profile and restores it on every
        # connect. Bluetooth headsets can land on "off" -- A2DP is often not
        # ready yet right after the ACL link comes up, and an interrupted
        # headset auto-switch can also settle there -- and once "off" is
        # stored the device reconnects with no sink node at all: connected in
        # bluetoothctl, present as a PipeWire device, but absent from every
        # output picker.
        #
        # This makes the restore hook skip a stored "off" (profile index 0)
        # and fall through to the best available profile instead. Any other
        # remembered profile is still honoured, so a deliberate choice of
        # a2dp-sink-sbc_xq or headset-head-unit survives, and profile memory
        # for ALSA cards is untouched.
        session.dont-restore-off-profile = true

        # Ask WirePlumber to create the normal high-quality playback profile
        # as soon as a Bluetooth audio device connects. This complements the
        # off-profile guard above without auto-opening a headset microphone.
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
]
