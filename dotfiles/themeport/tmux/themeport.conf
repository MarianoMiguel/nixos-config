# themeport tmux colors (sourced from tmux.conf)
set -g status-style "bg=#13141c,fg=#a9b1d6"
set -g status-left-style "bg=#7aa2f7,fg=#1a1b26"
set -g window-status-current-style "bg=#292e42,fg=#c0caf5,bold"
set -g window-status-style "bg=default,fg=#565f89"
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#292e42,fg=#c0caf5"
set -g copy-mode-match-style "bg=#e0af68,fg=#1a1b26"
set -g copy-mode-current-match-style "bg=#f7768e,fg=#1a1b26"
