[build-system]
requires = [ "setuptools" ]
build-backend = "setuptools.build_meta"

[project]
name = "voiceagent"
version = "0.2.0"
description = "Speak to a real Claude Code terminal"
requires-python = ">=3.11"
dependencies = [
  "aiohttp",
  "sounddevice",
  "webrtcvad",
]

[project.scripts]
voiceagent = "voiceagent:main"

[tool.setuptools]
packages = [ "voiceagent" ]

# The floating panel is QML that ships beside the module and is located
# relative to __file__, so it has to land in the installed package.
[tool.setuptools.package-data]
voiceagent = [ "*.qml" ]
