# themeport tmux colors (sourced from tmux.conf)
set -g status-style "bg=#151516,fg=#FFFFFF"
set -g status-left-style "bg=#7A7A7A,fg=#1C1C1E"
set -g window-status-current-style "bg=#808080,fg=#FFFFFF,bold"
set -g window-status-style "bg=default,fg=#2C2C2E"
set -g pane-border-style "fg=#808080"
set -g pane-active-border-style "fg=#7A7A7A"
set -g message-style "bg=#808080,fg=#FFFFFF"
set -g mode-style "bg=#808080,fg=#FFFFFF"
set -g copy-mode-match-style "bg=#6A6A6A,fg=#1C1C1E"
set -g copy-mode-current-match-style "bg=#F2F2F2,fg=#1C1C1E"
