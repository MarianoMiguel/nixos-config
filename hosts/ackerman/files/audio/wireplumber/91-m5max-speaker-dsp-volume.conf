# m5max-linux, 2026-11-08: the J716 speaker chains drive the raw speaker PCM at 0 dB, as asahi-audio
# expects (the user volume lives on the J716 sink). Their DSP output streams restore neither a saved
# volume nor a target, so a stale state (47 %, -19.6 dB) can never come back.
stream.rules = [
  {
    matches = [
      { node.name = "effect_output.j716-convolver" }
      { node.name = "effect_output.j716-bringup" }
    ]
    actions = { update-props = { state.restore-props = false, state.restore-target = false } }
  }
]
